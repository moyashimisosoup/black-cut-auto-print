name: APP-033 Update Batch Self-Test

on:
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/update-batch-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-windows-checksum-gate:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell script syntax and safe preflight
        shell: pwsh
        run: |
          $script = Join-Path $PWD 'packaging/apply_update.ps1'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "PowerShell syntax error: $($parseErrors[0])" }
          $dir = Join-Path $env:RUNNER_TEMP 'APP033-package-test'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item $script (Join-Path $dir 'apply_update.ps1')
          [System.IO.File]::WriteAllBytes((Join-Path $dir 'BlackCutPrintTrayCandidate.exe'), [byte[]](77,90,1,2,3,4))
          $hash = (Get-FileHash (Join-Path $dir 'BlackCutPrintTrayCandidate.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $dir 'new_exe_sha256.txt') -Value $hash -NoNewline -Encoding ascii
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dir 'apply_update.ps1') -CheckPackageOnly
          if ($LASTEXITCODE -ne 0) { throw 'Valid bundle incorrectly rejected' }
          ('0' * 64) | Set-Content -LiteralPath (Join-Path $dir 'new_exe_sha256.txt') -NoNewline -Encoding ascii
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dir 'apply_update.ps1') -CheckPackageOnly
          if ($LASTEXITCODE -eq 0) { throw 'Corrupted checksum was accepted' }
          if (!(Test-Path (Join-Path $dir 'BlackCutPrintTrayCandidate.exe'))) { throw 'Preflight deleted the test EXE' }
          Write-Host 'PRECHECK PASS: valid hash accepted, bad hash refused; no installation performed.'
